<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Адмінка — Залізна Зміна</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Inter, system-ui, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: #f4f0ea;
      color: #1f1a17;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .wrap { width: 100%; max-width: 720px; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p.sub { color: #666; margin: 0 0 24px; font-size: 13px; }
    .login-box, .table-box {
      background: white;
      border: 1px solid #e3d9cc;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    }
    .login-box { display: flex; gap: 10px; flex-wrap: wrap; }
    input[type="password"] {
      flex: 1;
      min-width: 200px;
      padding: 10px 14px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }
    button {
      background: #d0021b;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { opacity: 0.92; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #eee; font-size: 13px; }
    th { color: #888; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
    .count { font-size: 13px; color: #666; margin-bottom: 12px; }
    .error { color: #d0021b; font-size: 13px; margin-top: 10px; }
    .hidden { display: none; }
    .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .top-row button { background: #333; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Зареєстровані користувачі</h1>
    <p class="sub">Ця сторінка приватна. Дані бачите лише ви за паролем адміністратора.</p>

    <div class="login-box" id="login-box">
      <input type="password" id="admin-password" placeholder="Пароль адміністратора" />
      <button onclick="loadUsers()">Показати</button>
    </div>
    <div class="error" id="error-msg"></div>

    <div class="table-box hidden" id="table-box" style="margin-top: 16px;">
      <div class="top-row">
        <div class="count" id="count-label"></div>
        <button onclick="loadUsers()">Оновити</button>
      </div>
      <table>
        <thead>
          <tr><th>Ім'я</th><th>Email</th><th>Дата реєстрації</th></tr>
        </thead>
        <tbody id="users-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadUsers() {
      const password = document.getElementById('admin-password').value;
      const errorEl = document.getElementById('error-msg');
      const tableBox = document.getElementById('table-box');
      errorEl.textContent = '';

      if (!password) {
        errorEl.textContent = 'Введіть пароль';
        return;
      }

      try {
        const res = await fetch('/api/admin/users', {
          headers: { 'X-Admin-Password': password }
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
          errorEl.textContent = data.error || 'Помилка доступу';
          tableBox.classList.add('hidden');
          return;
        }

        document.getElementById('count-label').textContent = `Всього: ${data.count}`;
        document.getElementById('users-body').innerHTML = data.users.map(u => `
          <tr>
            <td>${escHtml(u.name)}</td>
            <td>${escHtml(u.email)}</td>
            <td>${escHtml(u.createdAt || '—')}</td>
          </tr>
        `).join('') || '<tr><td colspan="3">Поки що немає користувачів.</td></tr>';

        tableBox.classList.remove('hidden');
        // зберігаємо пароль у пам'яті сесії вкладки, щоб не вводити щоразу
        sessionStorage.setItem('admin-password', password);
      } catch (error) {
        errorEl.textContent = 'Не вдалося завантажити дані: ' + error.message;
      }
    }

    function escHtml(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // автозаповнення паролю з sessionStorage, якщо вже вводили в цій вкладці
    window.addEventListener('DOMContentLoaded', () => {
      const saved = sessionStorage.getItem('admin-password');
      if (saved) {
        document.getElementById('admin-password').value = saved;
        loadUsers();
      }
    });
  </script>
</body>
</html>
