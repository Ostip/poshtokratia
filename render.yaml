services:
  - type: web
    name: zalizna-zmina
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Ключ для /admin (студії заходів). Задай свій у Render → Environment.
      - key: ADMIN_PASSWORD
        sync: false
      # Секрет для підпису сесій — Render згенерує сам.
      - key: SESSION_SECRET
        generateValue: true
